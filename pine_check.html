<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pine Script Checker</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:12px; background:#0e0e0e; color:#e8e8e8;
         font-family:-apple-system,Roboto,Segoe UI,sans-serif; }
  h1 { font-size:16px; margin:0 0 4px; }
  .sub { font-size:12px; color:#8b8b8b; margin:0 0 10px; line-height:1.5; }
  button { border:0; border-radius:10px; color:#fff; font-weight:700;
           font-size:15px; padding:14px; }
  #run { background:#0a8f3c; width:100%; font-size:17px; padding:16px; }
  #clr { background:#3a3a3a; flex:1; }
  #sample { background:#3a3a3a; flex:1; }
  .row { display:flex; gap:8px; margin:8px 0; }
  textarea { width:100%; height:34vh; background:#000; color:#9ae6b4;
             border:1px solid #2c2c2c; border-radius:10px; padding:10px;
             font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px;
             line-height:1.4; white-space:pre; }
  #out { margin-top:10px; font-size:13px; }
  .ok { color:#4ade80; font-weight:700; font-size:15px; padding:10px 0; }
  .bad { color:#f87171; }
  .err { background:#1c1010; border-left:3px solid #f87171; border-radius:6px;
         padding:9px 10px; margin:8px 0; }
  .loc { color:#fbbf24; font-size:12px; font-weight:700; margin-bottom:4px; }
  .msg { color:#fca5a5; font-size:12.5px; line-height:1.45; }
  .src { color:#9ae6b4; font-family:ui-monospace,Menlo,Consolas,monospace;
         font-size:11px; margin-top:6px; white-space:pre-wrap; word-break:break-all; }
  .busy { color:#fbbf24; font-weight:700; padding:10px 0; }
</style>
</head>
<body>
<h1>Pine Script Checker</h1>
<p class="sub">Paste a Pine script and it is compiled by <b>TradingView's own
compiler</b> &mdash; the same one the Pine Editor uses. Errors come back with the
exact line and column. Nothing is saved anywhere.</p>

<textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off"
          placeholder="//@version=5&#10;indicator(&quot;My script&quot;)&#10;plot(close)"></textarea>
<div class="row">
  <button id="sample">SAMPLE</button>
  <button id="clr">CLEAR</button>
</div>
<button id="run">CHECK SCRIPT</button>
<div id="out"></div>

<script>
const ENDPOINT =
  'https://pine-facade.tradingview.com/pine-facade/translate_light/?user_name=anonymous';

const ta  = document.getElementById('code');
const out = document.getElementById('out');

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('clr').onclick = () => {
  ta.value = '';
  out.innerHTML = '';
  ta.focus();
};

document.getElementById('sample').onclick = () => {
  ta.value = '//@version=5\nindicator("My script", overlay=true)\n'
           + 'len = input.int(14, "Length")\n'
           + 'plot(ta.sma(close, len), "SMA", color=color.blue)\n'
           + 'plot(ta.rsi(close, len), "RSI")\n';
  out.innerHTML = '';
};

document.getElementById('run').onclick = async () => {
  const src = ta.value;
  if (!src.trim()) {
    out.innerHTML = '<div class="busy">Paste a script first.</div>';
    return;
  }

  // Any non-ASCII character breaks the Pine compiler. This is what happens when
  // a script is copied from a chat message with typographic dashes or quotes.
  const bad = [];
  src.split('\n').forEach((line, i) => {
    for (const ch of line) {
      if (ch.codePointAt(0) > 127) bad.push({line: i + 1, ch: ch});
    }
  });

  out.innerHTML = '<div class="busy">compiling ...</div>';

  let json = null;
  try {
    const body = new URLSearchParams();
    body.set('source', src);
    const r = await fetch(ENDPOINT, { method: 'POST', body: body });
    json = await r.json();
  } catch (e) {
    out.innerHTML = '<div class="bad">Could not reach the compiler: '
                  + esc(e.message) + '</div>';
    return;
  }

  const errs = ((json || {}).result || {}).errors2 || [];
  const lines = src.split('\n');
  let html = '';

  if (bad.length) {
    html += '<div class="bad" style="margin-bottom:8px"><b>'
          + bad.length + ' non-ASCII character(s)</b> &mdash; these always break '
          + 'Pine. Usually a dash or quote pasted from a chat message.</div>';
    bad.slice(0, 6).forEach(b => {
      html += '<div class="err"><div class="loc">line ' + b.line + '</div>'
            + '<div class="msg">character ' + esc(b.ch)
            + ' (U+' + b.ch.codePointAt(0).toString(16).toUpperCase()
            + ') is not ASCII</div></div>';
    });
  }

  if (!errs.length) {
    html += '<div class="ok">No errors \u2713 the script compiles</div>';
    if (!bad.length) {
      html += '<div class="sub">Add it to a chart in TradingView to see the plots '
            + 'and run the strategy tester.</div>';
    }
  } else {
    html += '<div class="bad" style="font-weight:700;padding:6px 0">'
          + errs.length + ' error(s)</div>';
    errs.forEach(e => {
      const st = e.start || {};
      const ln = st.line;
      html += '<div class="err"><div class="loc">line ' + ln + ', col '
            + st.column + '</div><div class="msg">' + esc(e.message) + '</div>';
      if (ln && lines[ln - 1] !== undefined) {
        html += '<div class="src">' + esc(lines[ln - 1]) + '</div>';
      }
      html += '</div>';
    });
  }
  out.innerHTML = html;
};
</script>
</body>
</html>
