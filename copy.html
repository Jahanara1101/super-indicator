<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Indicator - copy</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:14px; background:#111; color:#eee;
         font-family:-apple-system,Roboto,Segoe UI,sans-serif; }
  h1 { font-size:17px; margin:0 0 10px; }
  ol { font-size:13px; color:#bbb; margin:0 0 14px; padding-left:20px; line-height:1.6; }
  ol b { color:#fff; }
  button { width:100%; padding:20px; font-size:20px; font-weight:700;
           border:0; border-radius:12px; margin-bottom:10px; color:#fff; }
  #copy { background:#0a8f3c; }
  #sel  { background:#2b6cb0; }
  #msg  { font-size:14px; min-height:22px; margin-bottom:10px; color:#4ade80;
          font-weight:600; line-height:1.4; }
  textarea { width:100%; height:40vh; background:#000; color:#9ae6b4;
             border:1px solid #333; border-radius:10px; padding:10px;
             font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px;
             line-height:1.35; white-space:pre; }
</style>
</head>
<body>
<h1>Super Indicator &mdash; Pine Script v5</h1>
<ol>
  <li>Tap <b>COPY</b> below (or SELECT ALL &rarr; long-press &rarr; Copy)</li>
  <li>Open TradingView &rarr; Pine Editor</li>
  <li>In the editor: tap the code, <b>long-press &rarr; Select all</b>, then press
      <b>backspace</b> so the old template is gone</li>
  <li><b>Paste</b> &rarr; Save &rarr; Add to chart</li>
</ol>
<div id="msg"></div>
<button id="copy">COPY</button>
<button id="sel">SELECT ALL (fallback)</button>
<textarea id="code" readonly spellcheck="false"></textarea>
<script>
const CODE = "//@version=5\nindicator(\"Super Indicator\", overlay=true, max_labels_count=500, max_lines_count=500, max_boxes_count=500, max_bars_back=1000)\n\nminConf   = input.float(30.0, \"Min confidence %\", minval=0.0, maxval=100.0, step=1.0)\nminScore  = input.float(0.45, \"Min net score\", minval=0.0, step=0.05)\nminVoters = input.int(4, \"Min active voters\", minval=1, maxval=12)\nshowLvls  = input.bool(true, \"Draw Entry / SL / TP\")\nslMin     = input.float(0.75, \"SL min x ATR\", minval=0.1, step=0.05)\nslMax     = input.float(2.00, \"SL max x ATR\", minval=0.1, step=0.05)\nliqAbove  = input.float(0.0, \"Liq cluster above (optional)\")\nliqBelow  = input.float(0.0, \"Liq cluster below (optional)\")\n\nwRSI    = 0.9\nwEMA    = 0.8\nwMACD   = 0.7\nwStruct = 0.7\nwVWAP   = 0.6\nwLiq    = 0.6\nwOB     = 0.6\nwTrend  = 0.6\nwBB     = 0.5\nwStoch  = 0.5\nwFVG    = 0.5\nwVP     = 0.5\n\nrsiV = ta.rsi(close, 14)\nfloat v1d = 0.0\nfloat v1w = 0.0\nif not na(rsiV)\n    if rsiV >= 70\n        v1d := -1.0\n        v1w := wRSI\n    else if rsiV <= 30\n        v1d := 1.0\n        v1w := wRSI\n    else if rsiV > 60\n        v1d := -0.4\n        v1w := wRSI * 0.4444\n    else if rsiV < 40\n        v1d := 0.4\n        v1w := wRSI * 0.4444\n\neFast = ta.ema(close, 20)\neSlow = ta.ema(close, 50)\nfloat v2d = 0.0\nfloat v2w = 0.0\nif not na(eFast) and not na(eSlow)\n    if close > eFast and eFast > eSlow\n        v2d := 1.0\n        v2w := wEMA\n    else if close < eFast and eFast < eSlow\n        v2d := -1.0\n        v2w := wEMA\n    else if close > eSlow\n        v2d := 0.4\n        v2w := wEMA * 0.5\n    else\n        v2d := -0.4\n        v2w := wEMA * 0.5\n\n[macdLine, macdSig, macdHist] = ta.macd(close, 12, 26, 9)\nfloat v3d = 0.0\nfloat v3w = 0.0\nif not na(macdHist) and not na(macdLine) and not na(macdSig)\n    if macdHist > 0 and macdLine > macdSig\n        v3d := 0.8\n        v3w := wMACD\n    else if macdHist < 0 and macdLine < macdSig\n        v3d := -0.8\n        v3w := wMACD\n\nswHigh = ta.pivothigh(high, 5, 5)\nswLow  = ta.pivotlow(low, 5, 5)\nvar float lastHigh = na\nvar float lastLow  = na\nif not na(swHigh)\n    lastHigh := swHigh\nif not na(swLow)\n    lastLow := swLow\nfloat v4d = 0.0\nfloat v4w = 0.0\nif not na(lastHigh) and not na(lastLow)\n    if close > lastHigh\n        v4d := 0.8\n        v4w := wStruct\n    else if close < lastLow\n        v4d := -0.8\n        v4w := wStruct\n\nvwapRoll = ta.sma(hlc3 * volume, 48) / ta.sma(volume, 48)\nfloat v5d = 0.0\nfloat v5w = 0.0\nif not na(vwapRoll) and vwapRoll > 0\n    dev = (close - vwapRoll) / vwapRoll * 100\n    if dev < -1.0\n        v5d := 1.0\n        v5w := wVWAP\n    else if dev > 1.0\n        v5d := -1.0\n        v5w := wVWAP\n\nfloat v6d = 0.0\nfloat v6w = 0.0\nif liqAbove > 0 and liqBelow > 0 and liqAbove > close and liqBelow < close\n    if (liqAbove - close) < (close - liqBelow)\n        v6d := 1.0\n        v6w := wLiq\n    else\n        v6d := -1.0\n        v6w := wLiq\nelse if liqAbove > 0 and liqAbove > close\n    v6d := 1.0\n    v6w := wLiq\nelse if liqBelow > 0 and liqBelow < close\n    v6d := -1.0\n    v6w := wLiq\n\navgBody = ta.sma(math.abs(close - open), 20)\nfloat obLo = na\nfloat obHi = na\nfloat obDir = 0.0\nif not na(avgBody) and avgBody > 0 and bar_index > 62\n    for i = 1 to 40\n        if math.abs(close[i] - open[i]) < avgBody\n            if close[i] < open[i] and (close[i - 1] - open[i - 1]) > 1.5 * avgBody\n                obLo := low[i]\n                obHi := high[i]\n                obDir := 1.0\n                break\n            if close[i] > open[i] and (open[i - 1] - close[i - 1]) > 1.5 * avgBody\n                obLo := low[i]\n                obHi := high[i]\n                obDir := -1.0\n                break\nfloat v7d = 0.0\nfloat v7w = 0.0\nif obDir > 0 and not na(obLo)\n    if close >= obLo\n        v7d := 0.6\n        v7w := wOB\n    else\n        v7d := 0.3\n        v7w := wOB * 0.5\nif obDir < 0 and not na(obHi)\n    if close <= obHi\n        v7d := -0.6\n        v7w := wOB\n    else\n        v7d := -0.3\n        v7w := wOB * 0.5\n\nlr0 = ta.linreg(close, 60, 0)\nlr1 = ta.linreg(close, 60, 1)\nslope = lr0 - lr1\nfloat v8d = 0.0\nfloat v8w = 0.0\nif not na(slope) and close > 0\n    norm = slope / close * 100\n    if norm > 0.05\n        v8d := 0.7\n        v8w := wTrend\n    else if norm < -0.05\n        v8d := -0.7\n        v8w := wTrend\n\nbbBasis = ta.sma(close, 20)\nbbDev   = 2.0 * ta.stdev(close, 20)\nbbUp    = bbBasis + bbDev\nbbLo    = bbBasis - bbDev\nfloat v9d = 0.0\nfloat v9w = 0.0\nif not na(bbUp) and not na(bbLo) and bbUp > bbLo\n    if close <= bbLo\n        v9d := 1.0\n        v9w := wBB\n    else if close >= bbUp\n        v9d := -1.0\n        v9w := wBB\n\nstK = ta.sma(ta.stoch(close, high, low, 14), 3)\nstD = ta.sma(stK, 3)\nfloat v10d = 0.0\nfloat v10w = 0.0\nif not na(stK) and not na(stD)\n    if stK < 20 and stK > stD\n        v10d := 1.0\n        v10w := wStoch\n    else if stK > 80 and stK < stD\n        v10d := -1.0\n        v10w := wStoch\n\nfloat fvgLo = na\nfloat fvgHi = na\nfloat fvgDir = 0.0\nif bar_index > 32\n    for i = 1 to 30\n        if high[i + 1] < low[i - 1]\n            fvgLo := high[i + 1]\n            fvgHi := low[i - 1]\n            fvgDir := 1.0\n            break\n        if low[i + 1] > high[i - 1]\n            fvgLo := high[i - 1]\n            fvgHi := low[i + 1]\n            fvgDir := -1.0\n            break\nfloat v11d = 0.0\nfloat v11w = 0.0\nif fvgDir > 0 and not na(fvgHi)\n    if close >= fvgHi\n        v11d := 0.6\n        v11w := wFVG\n    else\n        v11d := 0.3\n        v11w := wFVG * 0.6\nif fvgDir < 0 and not na(fvgLo)\n    if close <= fvgLo\n        v11d := -0.6\n        v11w := wFVG\n    else\n        v11d := -0.3\n        v11w := wFVG * 0.6\n\nvar array<float> vpVols = array.new_float(40, 0.0)\nfloat pocVal = na\nfloat vaLow = na\nfloat vaHigh = na\nif bar_index >= 200\n    float hiW = high\n    float loW = low\n    for i = 0 to 199\n        hiW := math.max(hiW, high[i])\n        loW := math.min(loW, low[i])\n    if hiW > loW\n        step = (hiW - loW) / 40\n        array.fill(vpVols, 0.0)\n        for i = 0 to 199\n            mid = (high[i] + low[i]) / 2\n            idx = math.max(0, math.min(int((mid - loW) / step), 39))\n            array.set(vpVols, idx, array.get(vpVols, idx) + nz(volume[i]))\n        pocIdx = array.indexof(vpVols, array.max(vpVols))\n        pocVal := loW + (pocIdx + 0.5) * step\n        total = array.sum(vpVols)\n        acc = array.get(vpVols, pocIdx)\n        int loI = pocIdx\n        int hiI = pocIdx\n        while acc < 0.7 * total and (loI > 0 or hiI < 39)\n            up = hiI < 39 ? array.get(vpVols, hiI + 1) : -1.0\n            dn = loI > 0 ? array.get(vpVols, loI - 1) : -1.0\n            if up >= dn\n                hiI := hiI + 1\n                acc := acc + math.max(up, 0)\n            else\n                loI := loI - 1\n                acc := acc + math.max(dn, 0)\n        vaLow := loW + loI * step\n        vaHigh := loW + (hiI + 1) * step\nfloat v12d = 0.0\nfloat v12w = 0.0\nif not na(pocVal) and not na(vaHigh) and not na(vaLow)\n    if close > vaHigh\n        v12d := 0.7\n        v12w := wVP\n    else if close < vaLow\n        v12d := -0.7\n        v12w := wVP\n\nnum = (v1d * v1w + v2d * v2w + v3d * v3w + v4d * v4w + v5d * v5w + v6d * v6w\n     + v7d * v7w + v8d * v8w + v9d * v9w + v10d * v10w + v11d * v11w + v12d * v12w)\nden = ((v1w > 0 ? v1w : 0) + (v2w > 0 ? v2w : 0) + (v3w > 0 ? v3w : 0)\n     + (v4w > 0 ? v4w : 0) + (v5w > 0 ? v5w : 0) + (v6w > 0 ? v6w : 0)\n     + (v7w > 0 ? v7w : 0) + (v8w > 0 ? v8w : 0) + (v9w > 0 ? v9w : 0)\n     + (v10w > 0 ? v10w : 0) + (v11w > 0 ? v11w : 0) + (v12w > 0 ? v12w : 0))\nspeakers = ((v1w > 0 ? 1 : 0) + (v2w > 0 ? 1 : 0) + (v3w > 0 ? 1 : 0)\n     + (v4w > 0 ? 1 : 0) + (v5w > 0 ? 1 : 0) + (v6w > 0 ? 1 : 0)\n     + (v7w > 0 ? 1 : 0) + (v8w > 0 ? 1 : 0) + (v9w > 0 ? 1 : 0)\n     + (v10w > 0 ? 1 : 0) + (v11w > 0 ? 1 : 0) + (v12w > 0 ? 1 : 0))\n\nconf   = den > 0 ? math.abs(num) / den * 100 : 0.0\nok     = conf >= minConf and math.abs(num) >= minScore and speakers >= minVoters\nsignal = ok ? (num > 0 ? 1 : num < 0 ? -1 : 0) : 0\n\natrV  = ta.atr(14)\nentry = close\nsupLvl = not na(lastLow)  and lastLow  < close ? lastLow  : na\nresLvl = not na(lastHigh) and lastHigh > close ? lastHigh : na\n\nfloat slLvl = na\nif signal == 1 and not na(atrV)\n    rawSl = na(supLvl) ? entry - 1.5 * atrV : math.min(supLvl, entry - slMin * atrV)\n    slLvl := math.max(rawSl, entry - slMax * atrV)\nif signal == -1 and not na(atrV)\n    rawSl = na(resLvl) ? entry + 1.5 * atrV : math.max(resLvl, entry + slMin * atrV)\n    slLvl := math.min(rawSl, entry + slMax * atrV)\n\nrisk = na(slLvl) ? na : math.abs(entry - slLvl)\ntp1 = na(risk) ? na : (signal == 1 ? entry + 2 * risk : entry - 2 * risk)\ntp2 = na(risk) ? na : (signal == 1 ? entry + 3 * risk : entry - 3 * risk)\ntp3 = na(risk) ? na : (signal == 1 ? entry + 4 * risk : entry - 4 * risk)\ntp4 = na(risk) ? na : (signal == 1 ? entry + 5 * risk : entry - 5 * risk)\n\nplot(eFast,    \"EMA 20\", color=color.new(color.blue, 0))\nplot(eSlow,    \"EMA 50\", color=color.new(color.red, 0))\nplot(vwapRoll, \"VWAP\",   color=color.new(color.white, 0), linewidth=2)\nplot(bbUp,     \"BB upper\", color=color.new(color.gray, 60))\nplot(bbLo,     \"BB lower\", color=color.new(color.gray, 60))\n\nbgcolor(signal == 1 ? color.new(color.green, 88) : signal == -1 ? color.new(color.red, 88) : na)\n\nnewBuy  = signal == 1  and nz(signal[1], 0) != 1\nnewSell = signal == -1 and nz(signal[1], 0) != -1\nplotshape(newBuy,  \"BUY\",  shape.triangleup,   location.belowbar, color.green, size=size.small)\nplotshape(newSell, \"SELL\", shape.triangledown, location.abovebar, color.red,   size=size.small)\n\nif showLvls and signal != 0 and not na(slLvl)\n    line.new(bar_index, slLvl, bar_index + 1, slLvl, color=color.red,   width=2)\n    line.new(bar_index, entry, bar_index + 1, entry, color=color.blue,  width=2, style=line.style_dashed)\n    line.new(bar_index, tp1,   bar_index + 1, tp1,   color=color.green, width=1, style=line.style_dotted)\n    line.new(bar_index, tp2,   bar_index + 1, tp2,   color=color.green, width=1, style=line.style_dotted)\n    line.new(bar_index, tp3,   bar_index + 1, tp3,   color=color.green, width=1, style=line.style_dotted)\n    line.new(bar_index, tp4,   bar_index + 1, tp4,   color=color.green, width=1, style=line.style_dotted)\n\nvar table info = table.new(position.top_right, 2, 8, border_width=1)\nif barstate.islast\n    dirStr = signal == 1 ? \"BUY\" : signal == -1 ? \"SELL\" : \"NO TRADE\"\n    table.cell(info, 0, 0, \"SUPER INDICATOR\", bgcolor=color.new(color.black, 20), text_color=color.white, text_size=size.small)\n    table.cell(info, 1, 0, dirStr, bgcolor=signal == 1 ? color.green : signal == -1 ? color.red : color.gray, text_color=color.white, text_size=size.small)\n    table.cell(info, 0, 1, \"Confidence\", text_size=size.small)\n    table.cell(info, 1, 1, str.tostring(conf, \"#.0\") + \"%\", text_size=size.small)\n    table.cell(info, 0, 2, \"Net score\", text_size=size.small)\n    table.cell(info, 1, 2, str.tostring(num, \"#.00\"), text_size=size.small)\n    table.cell(info, 0, 3, \"Voters active\", text_size=size.small)\n    table.cell(info, 1, 3, str.tostring(speakers), text_size=size.small)\n    table.cell(info, 0, 4, \"Entry / SL\", text_size=size.small)\n    table.cell(info, 1, 4, na(slLvl) ? \"-\" : str.tostring(entry, format.mintick) + \" / \" + str.tostring(slLvl, format.mintick), text_size=size.small)\n    table.cell(info, 0, 5, \"TP1 / TP2\", text_size=size.small)\n    table.cell(info, 1, 5, na(tp1) ? \"-\" : str.tostring(tp1, format.mintick) + \" / \" + str.tostring(tp2, format.mintick), text_size=size.small)\n    table.cell(info, 0, 6, \"TP3 / TP4\", text_size=size.small)\n    table.cell(info, 1, 6, na(tp3) ? \"-\" : str.tostring(tp3, format.mintick) + \" / \" + str.tostring(tp4, format.mintick), text_size=size.small)\n    table.cell(info, 0, 7, \"ATR(14)\", text_size=size.small)\n    table.cell(info, 1, 7, na(atrV) ? \"-\" : str.tostring(atrV, format.mintick), text_size=size.small)\n\nalertcondition(newBuy,  \"Super BUY\",  \"Super Indicator BUY\")\nalertcondition(newSell, \"Super SELL\", \"Super Indicator SELL\")\n";
const ta  = document.getElementById('code');
const msg = document.getElementById('msg');
ta.value = CODE;

function ok(t, c) { msg.style.color = c; msg.textContent = t; }

function legacyCopy() {
  ta.focus();
  ta.setSelectionRange(0, CODE.length);
  let done = false;
  try { done = document.execCommand('copy'); } catch (e) { done = false; }
  return done;
}

document.getElementById('copy').onclick = async () => {
  // 1. modern async clipboard
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(CODE);
      return ok('COPIED \u2713  now paste it in TradingView', '#4ade80');
    } catch (e) { /* fall through */ }
  }
  // 2. legacy execCommand
  if (legacyCopy()) {
    return ok('COPIED \u2713  now paste it in TradingView', '#4ade80');
  }
  // 3. give the user a live selection to long-press
  ta.focus();
  ta.setSelectionRange(0, CODE.length);
  ok('Clipboard is blocked in this browser. Text is selected \u2014 '
     + 'long-press it and choose Copy. (Tip: open this page in Chrome.)', '#fbbf24');
};

document.getElementById('sel').onclick = () => {
  ta.focus();
  ta.setSelectionRange(0, CODE.length);
  try { document.execCommand('copy'); } catch (e) {}
  ok('Text selected \u2014 long-press it and choose Copy', '#60a5fa');
};

ok('ready \u2014 ' + CODE.split('\n').length + ' lines', '#4ade80');
</script>
</body>
</html>
